<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipo Typst · Ver libro (Fase 0)</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #e9e4dc; color: #2b2724; }
  header { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: #fbf9f5; border-bottom: 1px solid #e6e0d7; }
  h1 { font: 17px Georgia, serif; margin: 0 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 12px; border: 1px solid #c9bfb2; border-radius: 6px; background: #fff; min-height: 40px; }
  input { font-size: 16px; padding: 6px 8px; width: 7em; }
  #stage { display: flex; justify-content: center; gap: 2px; padding: 16px 8px; min-height: 40vh; }
  .page { background: #fff; box-shadow: 0 2px 12px rgb(0 0 0 / 0.18); line-height: 0; }
  .page.empty { visibility: hidden; width: 1px; }
  #nav { position: sticky; bottom: 0; background: #fbf9f5; padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid #e6e0d7; }
  #log { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; padding: 12px 16px; margin: 0; }
  .muted { color: #8a8279; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Prototipo Typst · Ver libro (Fase 0, descartable)</h1>
  <p class="muted">Compone en este dispositivo una novela sintética con Typst (WebAssembly). No usa datos de Procesador.
  La primera vez descarga ~11 MB (compilador) y ~1,3 MB de fuentes.</p>
  <div class="row">
    <button id="b50">50.000 palabras</button>
    <button id="b100">100.000</button>
    <button id="b200">200.000</button>
    <button id="chap">Verificar por capítulos (50k)</button>
    <button id="cb200">Por capítulos (200k)</button>
    <button id="pdf">Descargar PDF</button>
    <button id="copy">Copiar resultados</button>
  </div>
</header>
<div id="stage"></div>
<div id="nav" class="row" hidden>
  <button id="prev">‹ Anterior</button>
  <button id="next">Siguiente ›</button>
  <span id="where" class="muted"></span>
  <input id="para" placeholder="c3p10" aria-label="Párrafo"><button id="go">Ir al párrafo</button>
</div>
<pre id="log"></pre>
<script type="module" src="./app.js"></script>
</body>
</html>
